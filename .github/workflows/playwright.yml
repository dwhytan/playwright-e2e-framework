name: CI — Playwright E2E Framework
on:
  # Every push and pull request runs only the smoke tests: a quick check that keeps our traffic to PeruRail low
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The full suite runs on demand from the Actions tab. To also run it every day at 06:00 in Peru,
  # remove the # from the two schedule lines below
  # schedule:
  #   - cron: '0 11 * * *'
  workflow_dispatch:
# Never run two suites against PeruRail at the same time
concurrency:
  group: perurail
  cancel-in-progress: false
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps firefox webkit
    - name: Run smoke tests
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      run: npm run test:smoke
    - name: Run full suite
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: npm test
    - name: AI failure triage
      if: always()
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: npm run ai:triage
    - name: Generate Allure Report
      if: always()
      run: npx allure generate allure-results --clean -o allure-report
    - name: Merge reports into gh-pages folder
      if: always()
      run: |
        mkdir -p gh-pages/playwright
        mkdir -p gh-pages/allure
        cp -r playwright-report/. gh-pages/playwright/
        cp -r allure-report/. gh-pages/allure/
    # Only the full suite is published, so the live reports always show every test
    - name: Deploy to GitHub Pages
      if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
