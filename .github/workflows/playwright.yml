name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Update visual snapshots
      run: npx playwright test tests/visual.spec.ts tests/mobile.spec.ts --update-snapshots
      continue-on-error: true
    - name: Run Playwright tests
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: npx playwright test
    - name: Generate Allure Report
      if: always()
      run: npx allure generate allure-results --clean -o allure-report
    - name: Merge reports into gh-pages folder
      if: always()
      run: |
        mkdir -p gh-pages/playwright
        mkdir -p gh-pages/allure
        cp -r playwright-report/. gh-pages/playwright/
        cp -r allure-report/. gh-pages/allure/
    - name: Create index page for GitHub Pages
      if: always()
      run: |
        cat > gh-pages/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
          <head>
            <meta charset="utf-8">
            <title>playwright-e2e-framework — Test Reports</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 80px auto; padding: 0 20px; }
              h1 { font-size: 1.4rem; margin-bottom: 8px; }
              p { color: #555; margin-bottom: 32px; }
              a { display: inline-block; margin-right: 16px; padding: 10px 20px; background: #0969da; color: white; border-radius: 6px; text-decoration: none; }
              a:hover { background: #0550ae; }
            </style>
          </head>
          <body>
            <h1>playwright-e2e-framework</h1>
            <p>Automated test reports — latest CI run</p>
            <a href="playwright/">Playwright Report</a>
            <a href="allure/">Allure Report</a>
          </body>
        </html>
        EOF
    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
